name: Stress Tests

on:
  workflow_dispatch:  # Manual trigger only — stress tests are resource-intensive
  pull_request:
    branches: [main]
    paths:
      - 'tests/stress/**'
      - 'database/connection.py'
      - 'services/**'

jobs:
  unit-and-integration:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    environment: AAU Grade Bot env

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest-asyncio

      - name: Run unit and integration tests
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          ADMIN_IDS: ${{ secrets.ADMIN_IDS }}
        run: |
          python -m pytest tests/ --ignore=tests/stress -v

  stress-mocked:
    name: Stress Tests (Mocked Backends)
    runs-on: ubuntu-latest
    needs: unit-and-integration

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest-asyncio

      - name: Run stress tests A, B, C, E (mocked backends)
        run: |
          python -m pytest tests/stress/ -v -s --tb=short \
            -k "not scenario_d" \
            --junit-xml=stress-results.xml

      - name: Upload stress test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stress-test-results-mocked
          path: stress-results.xml

  stress-db:
    name: Stress Tests (Real PostgreSQL)
    runs-on: ubuntu-latest
    needs: unit-and-integration

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest-asyncio testcontainers[postgres]

      - name: Run Scenario D (real PostgreSQL)
        env:
          SKIP_DOCKER_TESTS: "false"
        run: |
          python -m pytest tests/stress/test_scenario_d_db_pool.py -v -s --tb=short \
            --junit-xml=stress-results-db.xml

      - name: Upload DB stress test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stress-test-results-db
          path: stress-results-db.xml
